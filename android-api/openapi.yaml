openapi: 3.0.3
info:
  title: NUDL Android API
  version: 0.1.0
  description: Android-facing REST contract for the NUDL IDE language pipeline.
servers:
  - url: https://api.example.invalid
paths:
  /api/v1/health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/nudl/lex:
    post:
      operationId: lex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NudlRequest'
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/nudl/parse:
    post:
      operationId: parse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NudlRequest'
      responses:
        '200':
          description: AST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/nudl/analyze:
    post:
      operationId: analyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NudlRequest'
      responses:
        '200':
          description: Diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/nudl/run:
    post:
      operationId: run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NudlRequest'
      responses:
        '200':
          description: Interpreter result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/nudl/generate:
    post:
      operationId: generate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NudlRequest'
      responses:
        '200':
          description: Generated source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
components:
  schemas:
    NudlRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
        filename:
          type: string
          default: main.nudl
        target:
          type: string
    ApiResponse:
      type: object
      properties:
        ok:
          type: boolean
        diagnostics:
          type: array
          items:
            type: object
        result: {}
